      --ivory: #f5f2ec;
      --ink: #182432;
      --quiet: #54616d;
      --blue: #034bf4;
      --blue-deep: #033dd0;
      --midnight: #101c2b;
      --page: var(--ivory);
      --text: var(--ink);
      --panel: var(--midnight);
      --link-rgb: 3 75 244;
      --link-solid: var(--blue);
      --heart: #b86b73;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1420;
        --text: var(--ivory);
        --quiet: #b1bcc9;
        --panel: var(--ink);
        --link-rgb: 143 177 255;
        --link-solid: #8fb1ff;
      }
    }

    * { box-sizing: border-box }
    html { font-size: 100%; scroll-behavior: smooth }
    body {
      margin: 0;
      overflow-x: clip;
      background: var(--page) var(--grain) repeat;
      background-size: 16rem 16rem;
      color: var(--text);
      font-family: Outfit, 'Helvetica Neue', Helvetica, sans-serif;
      font-size: 1.125rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p, dl, dd, ul { margin: 0 }
    ul { padding: 0; list-style: none }
    img { display: block; max-width: 100%; height: auto }

    /* Links. Brand blue at 90% alpha, opaque with a deeper underline on hover and focus. */
    a { color: rgb(var(--link-rgb) / .9); text-decoration-line: underline; text-decoration-thickness: .0625rem; text-underline-offset: .125rem; transition: color .2s ease-in-out, text-underline-offset .2s ease-in-out }
    a:hover, a:focus-visible { color: var(--link-solid); text-underline-offset: .3125rem }
    :focus-visible { outline: .1875rem solid var(--link-solid); outline-offset: .25rem }
    .plain, .plain:hover, .plain:focus-visible { color: inherit; text-decoration: none }

    .skip { position: absolute; left: 1rem; top: -4rem; padding: .625rem 1rem; background: var(--ink); color: var(--ivory); border-radius: .5rem; z-index: 2 }
    .skip:focus { top: 1rem; color: var(--ivory) }

    .button { display: inline-flex; align-items: center; gap: .625rem; padding: .875rem 1.375rem; border-radius: 6rem; background: var(--blue); color: #fff; font-weight: 600; line-height: 1.2; text-decoration: none; transition: background-color .2s ease-in-out }
    .github-icon { width: 1.125rem; height: 1.125rem; flex: none }
    .button:hover, .button:focus-visible { background: var(--blue-deep); color: #fff }
    .button:focus-visible { outline-offset: .3125rem }

    .wrap { max-width: 80rem; margin: 0 auto; padding: 0 3rem }

    /* Type scale. Everything in rem; nothing below .875rem. Headings sit above their content, never beside it. */
    h1 { font-size: 5.5rem; font-weight: 600; letter-spacing: -.045em; line-height: .98 }
    h2 { font-size: 2.75rem; font-weight: 600; letter-spacing: -.04em; line-height: 1.08 }
    h3 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.3 }

    /* Lockup. Ribbon mark left of the wordmark; each image keeps its own geometry. */
    .mark { display: inline-flex; align-items: center; gap: .5rem }
    .mark .ribbon { height: 1rem; width: 1rem; flex: none }
    .mark .wordmark { height: 1.75rem; width: auto; flex: none }

    /* Header */
    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.25rem 1.5rem; padding: 1.75rem 0 }
    .top nav { display: flex; align-items: center; gap: 2rem }
    .top nav a:not(.button) { color: var(--text); text-decoration: none; font-weight: 500 }
    .top nav a:not(.button):hover, .top nav a:not(.button):focus-visible { color: var(--link-solid) }

    /* Hero. Headline owns the left, the matte ribbon drifts past the right column edge. */
    .hero { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: center; gap: 2rem 3rem; padding: 4rem 0 6rem }
    .hero-copy p { max-width: 34rem; margin-top: 1.75rem; font-size: 1.375rem; line-height: 1.45; color: var(--quiet) }
    .cta { display: flex; align-items: center; flex-wrap: wrap; gap: 1.25rem 1.75rem; margin-top: 2.5rem }
    .cta a:not(.button) { font-weight: 500 }
    .hero-art { --shift: 6%; position: relative; justify-self: end; width: 100%; max-width: 34rem; transform: translateX(var(--shift)) }
    .hero-art img { width: 100%; filter: drop-shadow(0 2.5rem 3rem rgb(24 36 50 / .18)) }

    /* Sections breathe instead of drawing rules. One column of headings, content grids below them. */
    .block { padding: 6rem 0 }
    .block h2 + .grid { margin-top: 3rem }

    .ethos { font-weight: 600; letter-spacing: -.035em; line-height: 1.18; max-width: 26ch }
    .ethos + p { margin-top: 2rem; max-width: 44rem; font-size: 1.25rem; line-height: 1.5; color: var(--quiet) }

    .principles { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem 4rem }
    .principles p { margin-top: .75rem; color: var(--quiet); max-width: 30rem }

    /* Midnight panel. The glass ribbon is the only colour in the page beyond the brand blue.
       Grid areas keep artwork in its own cell so it can never sit under text. */
    .panel { position: relative; overflow: hidden; border-radius: 1.75rem; padding: 4.5rem 4rem 4rem; background: var(--panel) var(--grain) repeat; background-size: 16rem 16rem; color: var(--ivory) }
    .panel-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "head art" "status status" "sign sign";
      column-gap: 3rem;
      align-items: start;
    }
    .panel-head { grid-area: head; max-width: 40rem }
    .panel .lead { margin-top: 1.5rem; font-size: 1.25rem; line-height: 1.5; color: rgb(245 242 236 / .82) }
    .panel-art { grid-area: art; width: 13rem; justify-self: end; transform: translate(10%, -12%); pointer-events: none }
    .panel-art img { width: 100%; filter: drop-shadow(0 0 3rem rgb(16 174 255 / .28)) }
    .status { grid-area: status; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.5rem 3rem; margin-top: 3.5rem }
    .status dt { font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.2 }
    .status dd { margin-top: .75rem; color: rgb(245 242 236 / .86) }
    .panel .mark { grid-area: sign; margin-top: 3.5rem; align-self: end }
    .panel .mark .wordmark { height: 1.5rem }

    /* Document links */
    .docs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2.5rem 3rem }
    .docs a { font-size: 1.5rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.3 }
    .docs p { margin-top: .5rem; color: var(--quiet) }

    /* Footer */
    .end { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 4rem 0 3.5rem }
    .end .mark .wordmark { height: 1.5rem }
    .end-copy { text-align: right; max-width: 34rem }
    .end-copy p { font-size: 1rem; color: var(--quiet) }
    .heart { display: inline-block; width: 1rem; height: 1rem; color: var(--heart); vertical-align: -.125rem; transform-origin: center }
    /* One pulse every 1.5 seconds is 40 BPM. */
    .end:hover .heart, .end:focus-within .heart { animation: heartbeat 1.5s ease-in-out infinite }
    @keyframes heartbeat { 0%, 30%, 100% { transform: scale(1) } 15% { transform: scale(1.18) } }

    /* Page load. Hero copy rises once, the ribbon follows and then drifts. */
    .rise { animation: rise .9s var(--ease) both }
    .rise:nth-child(2) { animation-delay: .08s }
    .rise:nth-child(3) { animation-delay: .16s }
    .hero-art { animation: rise-art 1.1s var(--ease) .1s both }
    .hero-art img { animation: drift 3.5s ease-in-out 1.2s 1 }
    @keyframes rise { from { opacity: 0; transform: translateY(1.25rem) } to { opacity: 1; transform: none } }
    @keyframes rise-art { from { opacity: 0; transform: translate(var(--shift), 1.25rem) } to { opacity: 1; transform: translateX(var(--shift)) } }
    @keyframes drift { 0%, 100% { transform: translateY(0) rotate(0) } 50% { transform: translateY(-.875rem) rotate(1deg) } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto }
      a, .button { transition: none }
      .rise, .hero-art, .hero-art img, .end:hover .heart, .end:focus-within .heart { animation: none }
    }

    @media (max-width: 64rem) {
      h1 { font-size: 4.5rem }
      .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
      .hero-art { --shift: 4% }
      .panel { padding: 3.5rem 3rem 3rem }
      .panel-art { width: 12rem }
      .status { grid-template-columns: 1fr; gap: 2rem }
      .status > div { max-width: 40rem }
      .docs { grid-template-columns: 1fr 1fr }
    }

    @media (max-width: 48rem) {
      .wrap { padding: 0 1.5rem }
      h1 { font-size: 3.75rem }
      h2 { font-size: 2.25rem }
      .top nav { gap: .75rem }
      .top nav a:not(.button) { display: none }
      .top nav a.blog-link { display: inline }
      .top nav .button { font-size: 1rem }
      .hero { grid-template-columns: 1fr; gap: 2.5rem; padding: 2.5rem 0 4.5rem }
      .hero-art { --shift: 0%; grid-row: 1; justify-self: center; max-width: 20rem }
      .hero-art img { animation: none }
      .block { padding: 4.5rem 0 }
      .block h2 + .grid { margin-top: 2.25rem }
      .ethos + p { font-size: 1.125rem }
      .principles, .docs { grid-template-columns: 1fr; gap: 2.25rem }
      /* Artwork leaves the heading row and closes the panel beside the wordmark, tucked past the corner. */
      .panel { padding: 2.5rem 1.75rem; border-radius: 1.25rem }
      .panel-grid { grid-template-areas: "head head" "status status" "sign art"; column-gap: 1.5rem }
      .panel .lead { font-size: 1.125rem }
      .panel-art { width: 10rem; align-self: end; transform: translate(28%, 30%) }
      .status { margin-top: 2.5rem }
      .panel .mark { margin-top: 2.5rem }
      .end { flex-direction: column; align-items: flex-start; gap: 1.5rem; padding: 3rem 0 2.5rem }
      .end-copy { text-align: left }
    }

    @media (max-width: 40rem) {
      .wrap { padding: 0 1.25rem }
      h1 { font-size: 2.75rem }
      .hero-copy p { font-size: 1.125rem }
      .hero-art { max-width: 15rem }
      .button { padding: .75rem 1.125rem }
      .top { gap: 1rem }
      .top .mark .wordmark { height: 1.375rem }
      .mark { gap: .375rem }
    }
  
    .journal { padding: 4rem 0 6rem }
    .journal > header { margin-bottom: 3rem }
    .journal h1 { font-size: 3.5rem; line-height: 1.1; max-width: 24ch }
    .journal .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
    .post-list, .post-body { max-width: 68ch }
    .post-month { margin: 3rem 0 1rem; color: #5f6b76; font-size: 1rem }
    .post-month:first-child { margin-top: 0 }
    .post-preview { display: flex; align-items: center; gap: 1.5rem }
    .post-preview + .post-preview { margin-top: 3rem }
    .post-preview-copy { flex: 1; min-width: 0 }
    .post-preview h2 { font-size: 2rem; overflow-wrap: anywhere }
    .post-preview .post-date { margin-top: .375rem }
    .post-summary { margin-top: .375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
    .post-thumb { display: block; width: 8rem; flex: none }
    .post-thumb img { width: 100%; aspect-ratio: 8 / 5; object-fit: contain; border-radius: .75rem; background: var(--panel) }
    .post-date { display: block; color: var(--quiet); font-size: 1rem }
    .post-header .post-date { margin-top: 1rem }
    .post-back { display: inline-block; margin-bottom: 2rem }
    .post-body > * + * { margin-top: 1.5rem }
    .post-body h2 { font-size: 2rem; margin-top: 3rem }
    .post-body h3 { margin-top: 2.5rem }
    .post-body ul { padding-left: 1.5rem; list-style: disc }
    .post-body ol { padding-left: 1.5rem }
    .post-body li + li { margin-top: .5rem }
    .post-body img { border-radius: 1rem; margin: 2rem 0; max-width: 100% }
    .post-body blockquote { margin: 2rem 0; padding-left: 1.5rem; color: var(--quiet) }
    .post-body pre { font-family: inherit; padding: 1.25rem; overflow-x: auto; background: var(--panel); color: var(--ivory); border-radius: 1rem }
    .post-body code { font-family: inherit; font-size: 1rem; overflow-wrap: anywhere }
    .post-body a, .post-body p { overflow-wrap: anywhere }
    @media (prefers-color-scheme: dark) {
      .post-month { color: #8794a3 }
    }
    @media (max-width: 48rem) {
      .journal { padding: 2.5rem 0 4rem }
      .journal h1 { font-size: 2.5rem }
      .post-preview { gap: 1rem }
      .post-preview h2 { font-size: 1.5rem }
      .post-thumb { width: 5.5rem }
    }
