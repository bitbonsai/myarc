<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>login fixture</title></head>
<body>
  <!-- Synthetic login form for tools/check_extension_store.sh. Nothing posts anywhere. -->
  <form id="login" action="#" onsubmit="return false">
    <label>Email <input id="email" name="email" type="email" autocomplete="username"></label>
    <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
