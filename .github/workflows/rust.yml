name: Rust core and foundation patch

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standalone-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check GN bridge Rust formatting
        run: rustfmt --check --edition 2024 browser/foundation/bridge.rs
      - name: Lint core and tests
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run standalone core tests
        run: cargo test --workspace --locked
      - name: Check M0 core dependency boundary
        run: |
          cargo metadata --locked --no-deps --format-version 1 > /tmp/myarc-core-metadata.json
          python3 - <<'PY'
          import json
          with open('/tmp/myarc-core-metadata.json') as source:
              metadata = json.load(source)
          core = next(p for p in metadata['packages'] if p['name'] == 'myarc-workspace')
          assert not core['dependencies'], 'M0 workspace core must remain dependency-free'
          PY
      - name: Check Chromium patch source freshness
        run: python3 tools/check_foundation_patch.py
